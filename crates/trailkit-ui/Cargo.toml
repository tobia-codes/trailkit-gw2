[package]
name = "trailkit-ui"
version = "0.0.0"
description = "Shared design system for trailkit Nexus addons: theme tokens and ImGui style scope"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish = false

[dependencies]
pulldown-cmark.workspace = true

# ImGui comes through nexus-rs (same imgui version as the host addon); Windows only (ROADMAP R39).
[target.'cfg(windows)'.dependencies]
log.workspace = true
nexus.workspace = true

# Headless ImGui harness for the integration tests in `tests/` (memo plan M65).
[target.'cfg(windows)'.dev-dependencies]
trailkit-ui-testing.workspace = true

[lints]
workspace = true
