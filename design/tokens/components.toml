# Layout of the shared addon components in pixels, or as a factor of the
# font size where `unit = "font_size"` (ROADMAP R118 `[addon]`). Gaps and
# paddings come from the spacing scale in `spacing.toml`, never from here (R148).

[addon.list]
title = "List"
selection_bar_width = { name = "list.selection_bar_width", value = 3.0, purpose = "Width of the selection bar" }

[addon.button]
title = "Button"
min_width = { name = "button.min_width", value = 4.0, unit = "font_size", purpose = "Minimum width of a text button" }
dropdown_max_width = { name = "button.dropdown_max_width", value = 16.0, unit = "font_size", purpose = "Maximum width of a dropdown field" }

[addon.menu]
title = "Menu"
min_width = { name = "menu.min_width", value = 14.0, unit = "font_size", purpose = "Minimum width of a command menu" }

[addon.tooltip]
title = "Tooltip"
max_width = { name = "tooltip.max_width", value = 34.0, unit = "font_size", purpose = "Width at which a tooltip's text wraps" }
