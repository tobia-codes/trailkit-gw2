# Spacing scale in pixels (ROADMAP R118). `[addon]` is the addons' scale;
# `[web]` gets its own scale in the frontend round.

[addon.spacing]
title = "Spacing"
extra_small = { name = "space.xs", value = 4.0, purpose = "Tightest gap" }
small = { name = "space.sm", value = 8.0, purpose = "Item gap, compact dividers" }
medium = { name = "space.md", value = 12.0, purpose = "Section dividers" }
large = { name = "space.lg", value = 16.0, purpose = "Dialog padding" }
extra_large = { name = "space.xl", value = 24.0, purpose = "Largest gap" }
