[workspace]
resolver = "3"
members = ["addons/trailkit-memo", "addons/*/shared", "addons/*/slices/*", "crates/trailkit-storage", "crates/trailkit-ui", "crates/trailkit-ui-testing", "tools/trailkit-datagen", "xtask"]

[workspace.package]
edition = "2024"
rust-version = "1.99.1"
license = "MIT"
repository = "https://github.com/tobia-codes/trailkit-gw2"
authors = ["tobia-codes"]

[workspace.dependencies]
# Pinned to a fixed commit (ROADMAP R31); re-verify the nexus-addon-dev skill §1 when bumping.
trailkit-ui = { path = "crates/trailkit-ui" }
trailkit-storage = { path = "crates/trailkit-storage" }
trailkit-ui-testing = { path = "crates/trailkit-ui-testing" }
# Addon-internal crates (ROADMAP R76).
trailkit-memo-shared = { path = "addons/trailkit-memo/shared" }
trailkit-memo-drafts = { path = "addons/trailkit-memo/slices/drafts" }
trailkit-memo-trash = { path = "addons/trailkit-memo/slices/trash" }
trailkit-memo-editor = { path = "addons/trailkit-memo/slices/editor" }
trailkit-memo-note-list = { path = "addons/trailkit-memo/slices/note-list" }
trailkit-memo-note-view = { path = "addons/trailkit-memo/slices/note-view" }
trailkit-memo-reset-schedule = { path = "addons/trailkit-memo/slices/reset-schedule" }
trailkit-memo-search = { path = "addons/trailkit-memo/slices/search" }
nexus = { git = "https://github.com/zerthox/nexus-rs", rev = "51bff5ab38ad11332316448b452ece1b773018cd", features = ["log"] }
log = "0.4"
anyhow = "1"
toml_edit = "0.25"
# One HTTP client (R65) and one date/time library (R66) for every crate.
ureq = "3.5.0"
# No bundled time-zone database (~230 KiB in every addon DLL): everything runs in
# UTC, local time comes from the operating system (ROADMAP R72).
jiff = { version = "0.2.38", default-features = false, features = ["std", "serde", "perf-inline"] }
# Persistence and data model (memo plan M16, M25, M29).
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
uuid = { version = "1.29.0", features = ["v7", "serde"] }
thiserror = "2.0.21"
tempfile = "3.27.0"
# Win32 calls (cursor size for tooltips, memo plan M84); same version as nexus-rs uses.
windows = { version = "0.62.2", features = ["Win32_UI_Input_KeyboardAndMouse", "Win32_UI_WindowsAndMessaging", "Win32_Graphics_Gdi", "Win32_System_Time"] }
# Markdown view (memo plan M19).
pulldown-cmark = { version = "0.13.6", default-features = false }

# Lint set (AGENTS.md "Rust conventions", ROADMAP R33). Every crate opts in with `[lints] workspace = true`.
[workspace.lints.rust]
missing_docs = "warn"
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.clippy]
missing_docs_in_private_items = "warn"
undocumented_unsafe_blocks = "warn"
unwrap_used = "warn"
expect_used = "warn"
dbg_macro = "warn"
todo = "warn"
mod_module_files = "warn"

[profile.release]
lto = "thin"
codegen-units = 1
