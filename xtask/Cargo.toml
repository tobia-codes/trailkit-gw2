[package]
name = "xtask"
version = "0.0.0"
description = "Repository task runner (deploy, version sync)"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish = false

[dependencies]
anyhow.workspace = true
toml_edit.workspace = true
serde_json = "1"
# Icons are pure shapes: no text/font or raster-image support needed.
resvg = { version = "0.49.0", default-features = false }
# Font subsetting (memo plan M62); only in this dev tool, never in an addon.
allsorts = { version = "0.17.0", default-features = false, features = ["flate2_rust"] }
# Icon list for the icon font subset.
trailkit-ui.workspace = true

[lints]
workspace = true
