# `unwrap_used` / `expect_used` are fine inside unit tests (ROADMAP R33).
allow-unwrap-in-tests = true
allow-expect-in-tests = true

# Crash traps (ROADMAP R104, Q355) are banned below as well.
# jiff is built without a time-zone database (ROADMAP R72): `TimeZone::system()`
# would silently fall back to UTC. Use the addon's own local-time helper.
disallowed-methods = [
    { path = "nexus::imgui::Ui::tooltip_text", reason = "use trailkit_ui::tooltip::draw_tooltip, which centers the text (M171)" },
    { path = "nexus::imgui::Ui::tooltip", reason = "use trailkit_ui::tooltip::draw_tooltip_with, which centers the text (M171)" },
    { path = "nexus::imgui::Ui::get_window_draw_list", reason = "panics while a caller holds the window's DrawListMut and crashed the game; use trailkit_ui::draw_list::window_draw_list (R104, Q355)" },
    { path = "nexus::imgui::sys::igSetWindowFocus_Nil", reason = "changing the focus mid-frame crashed the game in ItemAdd; let ImGui focus at the end of the frame (nexus-addon-dev skill §2.9, R104 Q355)" },
    { path = "nexus::imgui::sys::igSetWindowFocus_Str", reason = "changing the focus mid-frame crashed the game in ItemAdd; let ImGui focus at the end of the frame (nexus-addon-dev skill §2.9, R104 Q355)" },
    { path = "jiff::tz::TimeZone::system", reason = "no bundled tzdb (R72); convert with the operating system, e.g. trailkit-memo `i18n::format_local_time`" },
]
