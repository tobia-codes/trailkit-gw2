# CI (ROADMAP R10, R14, R19, R34). Required on PRs to `main` (R9).
name: CI

on:
  pull_request:
  # PRs into `develop` were already checked; only `main` runs again on push (R70).
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  changes:
    name: Detect code changes (R70)
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.detect.outputs.code }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      # Docs-only PRs skip the Windows job: Markdown outside the embedded
      # help pages (`addons/*/help/`) cannot change any build output.
      - id: detect
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          if [ "$EVENT_NAME" != "pull_request" ]; then
            echo "code=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          changed=$(git diff --name-only "$BASE_SHA"...HEAD)
          code_files=$(printf '%s\n' "$changed" | grep -vE '^docs/|\.md$' || true)
          help_files=$(printf '%s\n' "$changed" | grep -E '^addons/[^/]+/help/' || true)
          code_files="$code_files$help_files"
          if [ -n "$code_files" ]; then
            echo "code=true" >> "$GITHUB_OUTPUT"
          else
            echo "code=false" >> "$GITHUB_OUTPUT"
          fi

  windows:
    name: Windows build, lint & test
    needs: changes
    # A skipped job counts as passed for required status checks.
    if: needs.changes.outputs.code == 'true'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      # rustup is preinstalled; rust-toolchain.toml selects the pinned toolchain.
      - name: Install pinned toolchain
        run: rustup toolchain install # explicit: rustup auto-install is deprecated
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Test
        run: cargo test --workspace
      - name: Naming conventions (R46)
        run: cargo xtask check-names
      - name: Version sync check (R16/R17)
        run: cargo xtask sync-versions --check
      - name: Icon PNGs up to date (R57)
        run: cargo xtask build-icons --check
      - name: Build addons (release)
        run: cargo build --workspace --release --exclude xtask --exclude trailkit-datagen
      - uses: actions/upload-artifact@v4
        with:
          name: addons-dll
          path: target/release/*.dll
          if-no-files-found: error

  deny:
    name: cargo-deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: EmbarkStudios/cargo-deny-action@v2

  branch-name:
    name: Branch name (R14)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Check branch name (shared with the local pre-push hook)
        env:
          HEAD_BRANCH: ${{ github.head_ref }}
          BASE_BRANCH: ${{ github.base_ref }}
        run: cargo xtask check-branch --head "$HEAD_BRANCH" --base "$BASE_BRANCH"
