# Daily GW2 price archive (docs/plans/data-pipeline.md D4–D39).
# The bot may create releases and upload assets on its own (D9);
# changes to THIS FILE need explicit user approval (AGENTS.md rule 1).
name: Price archive

on:
  schedule:
    - cron: "17 0 * * *" # daily run (D7)
    - cron: "17 6 * * *" # catch-up run: repeats anything not complete, fails on gaps (D7, D35)
    - cron: "23 17 * * 5" # WvW snapshot before the EU reset, Fri 18:00 UTC (D29)
    - cron: "23 1 * * 6" # WvW snapshot before the NA reset, Sat 02:00 UTC (D29)
  workflow_dispatch:
    inputs:
      mode:
        description: What to run
        type: choice
        options: [catch-up, archive, wvw-eu, wvw-na]
        default: catch-up

permissions:
  contents: write # create the monthly release and upload assets
  actions: write # keep-alive: re-enable the scheduled workflows (D38)

concurrency:
  group: price-archive
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  GH_TOKEN: ${{ github.token }}
  OUT_DIR: out

jobs:
  capture:
    name: Capture
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5

      - name: Select mode, date and release
        id: plan
        env:
          EVENT: ${{ github.event_name }}
          SCHEDULE: ${{ github.event.schedule }}
          INPUT_MODE: ${{ inputs.mode }}
        run: |
          case "$EVENT|$SCHEDULE" in
            "schedule|17 0 * * *") mode=archive ;;
            "schedule|17 6 * * *") mode=catch-up ;;
            "schedule|23 17 * * 5") mode=wvw-eu ;;
            "schedule|23 1 * * 6") mode=wvw-na ;;
            "workflow_dispatch|"*) mode="$INPUT_MODE" ;;
            *) echo "unknown trigger $EVENT|$SCHEDULE"; exit 1 ;;
          esac
          case "$mode" in archive|catch-up|wvw-eu|wvw-na) ;; *) echo "invalid mode"; exit 1 ;; esac
          {
            echo "mode=$mode"
            echo "date=$(date -u +%F)"
            echo "month=$(date -u +%Y-%m)"
            echo "tag=prices-$(date -u +%Y-%m)"
          } >> "$GITHUB_OUTPUT"

      - name: Install pinned toolchain
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - name: Build trailkit-datagen
        run: cargo build --release --locked -p trailkit-datagen

      - name: Ensure monthly release exists (D39)
        env:
          TAG: ${{ steps.plan.outputs.tag }}
          MONTH: ${{ steps.plan.outputs.month }}
          SHA: ${{ github.sha }}
        run: |
          if ! gh release view "$TAG" > /dev/null 2>&1; then
            gh release create "$TAG" --target "$SHA" --latest=false \
              --title "Price archive $MONTH" \
              --notes "Daily Guild Wars 2 trading post archive for $MONTH: prices, condensed order book, WvW matches and gem exchange quotes, one gzip file per data set and day plus a \`<date>.manifest.json\` with the status of every data set. Format and Postgres import: https://github.com/${{ github.repository }}/tree/main/tools/trailkit-datagen#readme"
          fi

      - name: Fetch today's manifest (skip data sets that are already complete)
        if: steps.plan.outputs.mode == 'archive' || steps.plan.outputs.mode == 'catch-up'
        env:
          TAG: ${{ steps.plan.outputs.tag }}
          DATE: ${{ steps.plan.outputs.date }}
        run: |
          mkdir -p "$OUT_DIR"
          gh release download "$TAG" --pattern "$DATE.manifest.json" --dir "$OUT_DIR" \
            || echo "no manifest for $DATE yet: full run"

      - name: Capture archive
        if: steps.plan.outputs.mode == 'archive'
        run: target/release/trailkit-datagen archive --out-dir "$OUT_DIR"

      - name: Capture archive (catch-up, fails if gaps remain)
        if: steps.plan.outputs.mode == 'catch-up'
        run: target/release/trailkit-datagen archive --out-dir "$OUT_DIR" --fail-if-incomplete

      - name: Capture WvW reset snapshot
        if: startsWith(steps.plan.outputs.mode, 'wvw-')
        env:
          MODE: ${{ steps.plan.outputs.mode }}
        run: target/release/trailkit-datagen wvw-snapshot --region "${MODE#wvw-}" --out-dir "$OUT_DIR"

      # Runs even if the capture failed, so partial results and the manifest are kept.
      - name: Upload files
        if: ${{ !cancelled() }}
        env:
          TAG: ${{ steps.plan.outputs.tag }}
        run: |
          shopt -s nullglob
          files=("$OUT_DIR"/*)
          if [ ${#files[@]} -gt 0 ]; then
            gh release upload "$TAG" "${files[@]}" --clobber
          fi

      - name: Keep scheduled workflows enabled (D38)
        if: ${{ !cancelled() }}
        env:
          REPOSITORY: ${{ github.repository }}
        # The API call succeeds (204) whether or not the workflow is already enabled.
        run: |
          for workflow in price-archive.yml dpf-reminder.yml; do
            gh api --method PUT "repos/$REPOSITORY/actions/workflows/$workflow/enable"
          done
